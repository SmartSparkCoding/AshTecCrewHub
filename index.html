<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the app draw under the notch; the safe-area
         insets in index.css keep the header and content clear of it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AshTec Crew Hub</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0d13" />
    <meta name="description" content="The Ashford School Tech Crew hub: events, venue check-in and the crew calendar." />

    <!-- iOS does not read the web app manifest for these, so they are set here. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AshTec" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
