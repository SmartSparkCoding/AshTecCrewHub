<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cat.png" />
    <!-- viewport-fit=cover lets the app draw under the notch; the safe-area
         insets in index.css keep the header and content clear of it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AshTec Crew Hub</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Replaced at runtime by syncThemeColor() in src/lib/theme.ts, which
         reads the page background, so light-mode members do not get a black
         status bar over a cream page. This is the first-paint default. -->
    <meta name="theme-color" content="#0c0d13" />
    <meta name="description" content="The Ashford School Tech Crew hub: events, venue check-in and the crew calendar." />

    <!-- Link previews. The parents page gets pasted into WhatsApp groups, and
         without these it arrived as a bare address with no title or picture.
         og:image has to be absolute, because the scrapers do not resolve it
         against the page they fetched. -->
    <meta property="og:site_name" content="AshTec Crew Hub" />
    <meta property="og:title" content="AshTec Crew Hub" />
    <meta property="og:description" content="The Ashford School Tech Crew hub: events, venue check-in and the crew calendar." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://ashtec.dino.icu/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AshTec Crew Hub" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AshTec Crew Hub" />
    <meta name="twitter:description" content="The Ashford School Tech Crew hub: events, venue check-in and the crew calendar." />
    <meta name="twitter:image" content="https://ashtec.dino.icu/og.png" />

    <!-- iOS does not read the web app manifest for these, so they are set here. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AshTec" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
